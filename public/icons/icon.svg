<?xml version="1.0" encoding="UTF-8"?>
<!--
  Marca de Scalar: una barra con discos, roja sobre negro.
  Esta es la FUENTE de los PNG de esta carpeta (192, 512, maskable y apple-touch).
  Si se cambia la geometría de aquí, hay que volver a generar los PNG:
  ver docs/11-operacion.md § "Los iconos de la app".
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#000000"/>
  <g fill="#FF0000">
    <!-- barra -->
    <rect x="92.16" y="232.96" width="327.68" height="46.08"/>
    <!-- discos exteriores -->
    <rect x="51.2"  y="143.36" width="51.2" height="225.28"/>
    <rect x="409.6" y="143.36" width="51.2" height="225.28"/>
    <!-- discos interiores -->
    <rect x="117.76" y="179.2" width="40.96" height="153.6"/>
    <rect x="353.28" y="179.2" width="40.96" height="153.6"/>
  </g>
</svg>
