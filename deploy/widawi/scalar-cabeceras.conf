# Las mismas cabeceras de vercel.json. Se incluye en cada location.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=()" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
# CSP: la app solo habla con su propio origen (Supabase va por la pasarela).
# Wompi se abre en su propio checkout; si un día se incrusta, hay que sumarlo.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://cloudflareinsights.com; frame-src https://checkout.wompi.co; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
