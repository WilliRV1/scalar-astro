# Scalar — entorno de prueba autoalojado en widawi (~/scalar-demo).
# Supabase recortado a lo que usa la app: Postgres, Auth, PostgREST y Storage.
# Un solo nginx sirve la SPA y hace de pasarela (/auth/v1, /rest/v1,
# /storage/v1), así el navegador habla con un único origen y no hay CORS.
# Público en https://scalar.widawi.online por el túnel de Cloudflare "widawi".
name: scalar-demo

x-logs: &logs
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

# Los healthchecks van a 127.0.0.1 y no a `localhost`: dentro de las imágenes
# alpine `localhost` resuelve primero a ::1 y storage/nginx solo escuchan en
# IPv4, así que el chequeo fallaba con el servicio funcionando.
services:
  db:
    image: supabase/postgres:17.6.1.136
    restart: unless-stopped
    <<: *logs
    volumes:
      - ./volumes/db/webhooks.sql:/docker-entrypoint-initdb.d/init-scripts/98-webhooks.sql:Z
      - ./volumes/db/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:Z
      - ./volumes/db/jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-jwt.sql:Z
      - db-data:/var/lib/postgresql/data
      - db-config:/etc/postgresql-custom
    ports:
      # Solo en el propio servidor; no se publica en el túnel.
      - 127.0.0.1:5433:5432
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: 5432
      POSTGRES_PORT: 5432
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: postgres
      POSTGRES_DB: postgres
      JWT_EXP: 3600
    # log_min_messages=warning: `fatal` (el default de Supabase) esconde los
    # errores del motor de cobros. pg_cron necesita saber en qué base correr.
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - log_min_messages=warning
      - -c
      - cron.database_name=postgres

  auth:
    image: supabase/gotrue:v2.196.0
    restart: unless-stopped
    <<: *logs
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:9999/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${PUBLIC_URL}/auth/v1
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_SITE_URL: ${PUBLIC_URL}
      GOTRUE_URI_ALLOW_LIST: ${PUBLIC_URL}/**
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      GOTRUE_LOG_LEVEL: warn
      GOTRUE_RATE_LIMIT_TOKEN_REFRESH: 150
      GOTRUE_PASSWORD_MIN_LENGTH: 8

  rest:
    image: postgrest/postgrest:v14.17
    restart: unless-stopped
    <<: *logs
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "postgrest", "--ready"]
      interval: 10s
      timeout: 5s
      retries: 3
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public,storage
      PGRST_DB_MAX_ROWS: 1000
      PGRST_DB_EXTRA_SEARCH_PATH: public,extensions
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: ${JWT_SECRET}
      PGRST_APP_SETTINGS_JWT_EXP: 3600
      PGRST_ADMIN_SERVER_PORT: 3001
      # `postgrest --ready` (el healthcheck) exige que el admin escuche en localhost.
      PGRST_ADMIN_SERVER_HOST: localhost

  storage:
    image: supabase/storage-api:v1.74.0
    restart: unless-stopped
    <<: *logs
    depends_on:
      db:
        condition: service_healthy
      rest:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5000/status"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      POSTGREST_URL: http://rest:3000
      AUTH_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      STORAGE_PUBLIC_URL: ${PUBLIC_URL}
      REQUEST_ALLOW_X_FORWARDED_PATH: "true"
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      GLOBAL_S3_BUCKET: stub
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: local
      ENABLE_IMAGE_TRANSFORMATION: "false"
    volumes:
      - storage-data:/var/lib/storage

  web:
    image: nginx:alpine
    restart: unless-stopped
    <<: *logs
    depends_on: [auth, rest, storage]
    ports:
      - 8099:80
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./scalar-cabeceras.conf:/etc/nginx/scalar-cabeceras.conf:ro
      - ./dist:/usr/share/nginx/html:ro

volumes:
  db-data:
  db-config:
  storage-data:
