# nginx del entorno autoalojado (widawi). Sirve la SPA y hace de pasarela hacia
# Auth, PostgREST y Storage bajo el mismo origen, así el navegador no hace CORS.
# Las cabeceras de seguridad son las mismas de vercel.json.

# El login y el registro se limitan por IP: 20 intentos por minuto, con una
# ráfaga de 10. Suficiente para una persona, insuficiente para un diccionario.
# Detrás del túnel de Cloudflare todo llega desde la misma IP, así que la
# clave es la IP real que manda Cloudflare; sin túnel, la de la conexión.
map $http_cf_connecting_ip $scalar_cliente {
  default $binary_remote_addr;
  "~."    $http_cf_connecting_ip;
}
limit_req_zone $scalar_cliente zone=scalar_auth:10m rate=20r/m;

# Formato de log sin la query string: en /rest/v1 van filtros con ids de
# atletas y no hace falta guardarlos (Ley 1581).
log_format scalar_corto '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent $request_time';

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 50m;
  access_log /var/log/nginx/access.log scalar_corto;

  # Cabeceras de seguridad. `always` para que salgan también en los 4xx/5xx.
  # Van repetidas en cada location porque un add_header dentro de un location
  # anula los del server.
  include /etc/nginx/scalar-cabeceras.conf;

  proxy_connect_timeout 10s;
  proxy_read_timeout    60s;
  proxy_send_timeout    60s;

  location = /auth/v1/token {
    limit_req zone=scalar_auth burst=10 nodelay;
    limit_req_status 429;
    proxy_pass http://auth:9999/token;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    include /etc/nginx/scalar-cabeceras.conf;
  }
  location = /auth/v1/signup {
    limit_req zone=scalar_auth burst=10 nodelay;
    limit_req_status 429;
    proxy_pass http://auth:9999/signup;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    include /etc/nginx/scalar-cabeceras.conf;
  }
  location /auth/v1/ {
    proxy_pass http://auth:9999/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    include /etc/nginx/scalar-cabeceras.conf;
  }
  location /rest/v1/ {
    proxy_pass http://rest:3000/;
    proxy_set_header Host $host;
    include /etc/nginx/scalar-cabeceras.conf;
  }
  location /storage/v1/ {
    proxy_pass http://storage:5000/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Prefix /storage/v1;
    include /etc/nginx/scalar-cabeceras.conf;
  }
  # Edge Functions: el edge-runtime del contenedor `functions`. El prefijo se
  # quita (la barra final del proxy_pass): la función ve /create-payment-link.
  # Los webhooks de Mercado Pago entran por aquí; responden en menos de 22 s o
  # Mercado Pago reintenta.
  location /functions/v1/ {
    proxy_pass http://functions:9000/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 60s;
    include /etc/nginx/scalar-cabeceras.conf;
  }

  # El service worker nunca se cachea; si no, la app no se actualiza.
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    include /etc/nginx/scalar-cabeceras.conf;
    try_files $uri =404;
  }
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/scalar-cabeceras.conf;
    try_files $uri =404;
  }
  # SPA: cualquier ruta profunda cae en index.html.
  location / {
    add_header Cache-Control "no-cache";
    include /etc/nginx/scalar-cabeceras.conf;
    try_files $uri $uri/ /index.html;
  }
}
