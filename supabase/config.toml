project_id = "scalar"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
# El registro queda abierto porque un invitado tiene que poder crear su cuenta
# al canjear el enlace. Tener cuenta no concede acceso a NADA: sin una fila en
# `memberships`, la RLS no devuelve ni un registro y el usuario cae en
# /sin-acceso. El alta de BOXES sí es manual, no pública.
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false   # solo en local

# El atleta entra con código al celular, no con contraseña.
[auth.sms]
enable_signup = false
enable_confirmations = true

# -----------------------------------------------------------------------------
# Edge Functions
# -----------------------------------------------------------------------------
# El webhook de Wompi lo llama Wompi, no un usuario con sesión. Sin
# `verify_jwt = false` la plataforma rechaza el evento ANTES de que la función
# lo vea, y ningún pago se concilia: la factura se queda abierta aunque el
# atleta haya pagado. Es el error de configuración más probable de toda la
# integración. La autenticidad del evento no la da el JWT, la da la firma que
# verifica la propia función.
[functions.wompi-webhook]
verify_jwt = false

# Esta sí la llama un usuario autenticado desde la aplicación.
[functions.create-payment-link]
verify_jwt = true

# Las tres funciones del motor de automatizaciones las llama un cron, no un
# usuario con sesión. Sin `verify_jwt = false` devuelven 401 y el motor no corre
# NUNCA: no sale un solo recordatorio de pago. Lo que las autentica es el
# secreto AUTOMATIONS_CRON_SECRET en la cabecera x-cron-secret, comparado en
# tiempo constante.
[functions.run-automations]
verify_jwt = false

[functions.process-outbox]
verify_jwt = false

[functions.weekly-report]
verify_jwt = false
